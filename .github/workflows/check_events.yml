name: Check Helsinki-area kids events

on:
  schedule:
    # 06:00 and 14:00 UTC daily (roughly 08:00/16:00 or 09:00/17:00
    # Helsinki time depending on daylight saving). Adjust as you like:
    # https://crontab.guru/
    - cron: '0 6,14 * * *'
  workflow_dispatch:
    inputs:
      seed_only:
        description: 'Seed mode: mark all matches as seen WITHOUT sending Telegram messages'
        type: boolean
        default: false

permissions:
  contents: write   # needed to commit the updated seen_events.json

jobs:
  check-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEED_ONLY: ${{ github.event.inputs.seed_only || 'false' }}
          PYTHONUNBUFFERED: "1"
        run: python scraper.py

      - name: Commit updated state file
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add seen_events.json
          git diff --cached --quiet || git commit -m "Update seen events [skip ci]"
          git push
